spring.application.name=Perfumeria
# Usar base de datos H2 en memoria (no requiere instalación)
spring.datasource.url=jdbc:h2:mem:perfumeriadb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuración de JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Habilitar la consola web de H2 para que puedas ver tus tablas desde el navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console